apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  repo: https://charts.jetstack.io
  chart: cert-manager
  version: v1.21.1
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |-
    # cert-manager Helm values for a small homeserver cluster.
    crds:
      enabled: true

    replicaCount: 1

    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}

    prometheus:
      enabled: false

    webhook:
      replicaCount: 1
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 96Mi}

    cainjector:
      replicaCount: 1
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 96Mi}

    startupapicheck:
      enabled: true
