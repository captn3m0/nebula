# Create the cloudflare-api-token-tatooine secret first: tofu apply in manifests/tofu/.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-tatooine
spec:
  acme:
    email: bb8@captnemo.in
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-tatooine-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-tatooine
              key: api-token
