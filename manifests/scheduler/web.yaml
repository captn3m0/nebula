# Serves only public/ from the scheduler's volume (the /_debug/social/ report), never the ledger
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-web
  labels:
    app.kubernetes.io/name: scheduler-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpd
          image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["httpd", "-f", "-p", "8080", "-h", "/state/public"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            tcpSocket: { port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 5m, memory: 4Mi }
            limits: { memory: 16Mi }
          volumeMounts:
            - { name: state, mountPath: /state, readOnly: true }
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: scheduler-state
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-web
spec:
  selector:
    app.kubernetes.io/name: scheduler-web
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scheduler-web
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`scheduler.blr.today`)
      kind: Rule
      services:
        - name: scheduler-web
          port: 8080
  tls:
    certResolver: letsencrypt-http
