# One-off: build the Bluesky ledger from the account's history before the first run
apiVersion: batch/v1
kind: Job
metadata:
  name: scheduler-adopt-bluesky
  namespace: scheduler
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: scheduler
        image: ghcr.io/blr-today/scheduler:1
        args:
        - adopt
        - bluesky
        env:
        - name: BLUESKY_APP_PASSWORDS
          valueFrom:
            secretKeyRef:
              name: scheduler-bluesky
              key: app-passwords
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: state
          mountPath: /state
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: scheduler-state
      - name: tmp
        emptyDir: {}
