apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduler
  labels:
    app.kubernetes.io/name: scheduler
spec:
  schedule: "*/5 * * * *"
  # adopt-job.yaml is only for recovery, see the scheduler README
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scheduler
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scheduler
              image: ghcr.io/blr-today/scheduler:10@sha256:0c8178b765ce92b485c9e990e04d4b3004eb94849eb9fb7e0ef58eaad01d6d47
              args: ["run"]
              env:
                # Posting hours run until 20:00 IST on this one date
                - name: SCHEDULER_DAY_END
                  value: "2026-10-06T20:00+05:30"
                - name: BLUESKY_APP_PASSWORDS
                  valueFrom:
                    secretKeyRef:
                      name: scheduler-bluesky
                      key: app-passwords
                - name: FEDI_TOKENS
                  valueFrom:
                    secretKeyRef:
                      name: scheduler-fedi
                      key: tokens
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # A run peaks around 80 MiB (measured 2026-10-06); the node has little to spare
              resources:
                requests:
                  cpu: 10m
                  memory: 96Mi
                limits:
                  memory: 192Mi
              volumeMounts:
                - name: state
                  mountPath: /state
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: scheduler-state
            - name: tmp
              emptyDir: {}
