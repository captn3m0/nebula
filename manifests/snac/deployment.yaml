# snac with the blr-today Event patch, built by github.com/blr-today/snac2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snac
  labels:
    app: snac
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: snac
  template:
    metadata:
      labels:
        app: snac
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init
          image: ghcr.io/blr-today/snac2:1@sha256:d827fbfdb139e7b41a59e88c71a7b26b7323b47a2564279edb0e420409cb55ab
          command:
            - sh
            - -euc
            - |
              if [ ! -f /data/snac/server.json ]; then
                printf '0.0.0.0\n8001\nfedi.blr.today\n\nme@captnemo.in\n' | snac init /data/snac
              fi
              sed -i -E 's/("local_purge_days": *)[0-9]+/\10/' /data/snac/server.json
              grep -q '"local_purge_days": 0' /data/snac/server.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: snac
          image: ghcr.io/blr-today/snac2:1@sha256:d827fbfdb139e7b41a59e88c71a7b26b7323b47a2564279edb0e420409cb55ab
          command: [snac, httpd, /data/snac]
          ports:
            - { name: http, containerPort: 8001 }
          readinessProbe:
            httpGet: { path: /api/v1/instance, port: http }
            initialDelaySeconds: 2
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
        - name: data
          persistentVolumeClaim:
            claimName: snac-data
