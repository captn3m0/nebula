# snac accepts uploads of any size, so traefik caps request bodies
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: snac-limits
spec:
  buffering:
    maxRequestBodyBytes: 16000000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: snac
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`fedi.blr.today`)
      kind: Rule
      middlewares:
        - name: snac-limits
      services:
        - name: snac
          port: 8001
    # snac serves its own icon here, ignoring favicon_url
    - match: Host(`fedi.blr.today`) && Path(`/favicon.ico`)
      kind: Rule
      middlewares:
        - name: snac-favicon
      services:
        - name: snac
          port: 8001
  tls:
    certResolver: letsencrypt-http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: snac-http
spec:
  entryPoints: [web]
  routes:
    - match: Host(`fedi.blr.today`)
      kind: Rule
      middlewares:
        - name: snac-https
      services:
        - name: snac
          port: 8001
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: snac-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: snac-favicon
spec:
  redirectRegex:
    regex: ^.*$
    replacement: https://blr.today/img/favicon.ico
