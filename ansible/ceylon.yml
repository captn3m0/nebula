# Keeps the 2 GB k3s node responsive under memory pressure (it hung on 2026-10-06)
- name: Memory safety for ceylon
  hosts: ceylon
  vars:
    swapfile: /swapfile
    swap_size_mb: 2048
  tasks:
    - name: Read the default route
      ansible.builtin.command: ip -4 route show default
      register: default_route
      changed_when: false
      check_mode: false
      tags: [egress]

    - name: Egress leaves via the anchor gateway, i.e. the floating IP
      ansible.builtin.assert:
        that: "'via 10.47.0.1 dev eth0' in default_route.stdout"
        fail_msg: "netplan default route lost the anchor gateway: {{ default_route.stdout }}"
      tags: [egress]

    - name: Create the swapfile
      ansible.builtin.command: fallocate -l {{ swap_size_mb }}M {{ swapfile }}
      args:
        creates: "{{ swapfile }}"
      register: swapfile_created

    - name: Restrict the swapfile to root
      ansible.builtin.file:
        path: "{{ swapfile }}"
        mode: "0600"
      when: not (ansible_check_mode and swapfile_created is changed)

    - name: Format the swapfile
      ansible.builtin.command: mkswap {{ swapfile }}
      when: swapfile_created is changed

    - name: Enable the swapfile at boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "{{ swapfile }} none swap sw 0 0"

    - name: Turn the swapfile on
      ansible.builtin.command: swapon {{ swapfile }}
      when: swapfile_created is changed

    - name: Prefer RAM and swap only under pressure
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-swappiness.conf
        content: "vm.swappiness = 10\n"
        mode: "0644"
      notify: Reload sysctl

    - name: Evict pods before the node runs out of memory, drop unused controllers
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          disable-cloud-controller: true
          disable-network-policy: true
          kubelet-arg:
            - "eviction-hard=memory.available<150Mi"
            - "eviction-minimum-reclaim=memory.available=100Mi"
        mode: "0600"
      notify: Restart k3s

    - name: Create the k3s systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/k3s.service.d
        state: directory
        mode: "0755"

    - name: Make the k3s Go runtime return idle heap to the OS (k3s.service.env is rewritten on upgrade)
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service.d/go-runtime.conf
        content: |
          [Service]
          Environment=GOMEMLIMIT=550MiB
          Environment=GOGC=50
        mode: "0644"
      notify: Restart k3s

    - name: Drop the old Go runtime settings from k3s.service.env
      ansible.builtin.lineinfile:
        path: /etc/systemd/system/k3s.service.env
        regexp: "^(GOMEMLIMIT|GOGC)="
        state: absent
      notify: Restart k3s

    - name: Stop docker, which k3s does not use
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [docker.socket, docker.service, containerd.service]
      failed_when: false

    - name: Create the journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Cap the journal size
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/size.conf
        content: |
          [Journal]
          SystemMaxUse=300M
        mode: "0644"
      notify: Restart journald

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/90-swappiness.conf

    - name: Restart k3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        daemon_reload: true

    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald
        state: restarted
